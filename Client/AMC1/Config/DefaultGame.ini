; [2026-09-04] 로그인 UI / 레벨 전환 배선
;   UAMC1GameInstance 가 UCLASS(Config=Game) 이므로 이 파일이 정본입니다.
;
;   LoginWidgetClass : 비워두면 기존처럼 기동 즉시 자동 로그인합니다(안전망).
;                      지정하면 LoginLevel 로드 시 위젯을 띄우고 Submit 을 기다립니다.
;   GameLevel        : 인증 성공 후 이동할 레벨의 **에셋 참조**(TSoftObjectPtr<UWorld>).
;                      비우면 레벨 전환 없이 곧바로 C_ENTER_GAME 을 보냅니다(안전망).
;
;   커맨드라인이 이 값들보다 우선합니다:  -AccountName=test02 -Password=test02
;
; [2026-09-04 레벨 배치 확정]
;   /Game/Level/LoginLevel   액터 10개  - 로그인 화면 (시작 맵)
;   /Game/Level/LobbyLevel   액터 74개  - 로그인한 사용자가 스폰되는 레벨
;
; [2026-09-04 5차 / P2-2] GameLevelName(FName) 을 GameLevel(TSoftObjectPtr<UWorld>) 로 교체했습니다.
;   에셋 참조이므로 **패키지 경로 전체**를 적습니다: /Game/Level/LobbyLevel.LobbyLevel
;   (마지막의 .LobbyLevel 은 패키지 안의 오브젝트 이름입니다. 빠뜨리면 해석되지 않습니다.)
;   문자열이 아니라 참조라서 에디터가 이름 변경·폴더 이동을 추적합니다 — B-2 재발 방지.
;   구 키 GameLevelName 은 제거되었습니다. 남아 있어도 아무 효과가 없으니 적지 마십시오.
