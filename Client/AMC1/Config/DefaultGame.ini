; [2026-09-04] 로그인 UI / 레벨 전환 배선
;   UAMC1GameInstance 가 UCLASS(Config=Game) 이므로 이 파일이 정본입니다.
;
;   LoginWidgetClass : 비워두면 기존처럼 기동 즉시 자동 로그인합니다(안전망).
;                      지정하면 LoginLevel 로드 시 위젯을 띄우고 Submit 을 기다립니다.
;   GameLevelName    : 인증 성공 후 이동할 레벨의 **에셋 이름**(경로 아님).
;                      비우면(NAME_None) 레벨 전환 없이 곧바로 C_ENTER_GAME 을 보냅니다.
;
;   커맨드라인이 이 값들보다 우선합니다:  -AccountName=test02 -Password=test02
;
; [2026-09-04 레벨 배치 확정]
;   /Game/Level/LoginLevel   액터 10개  - 로그인 화면 (시작 맵)
;   /Game/Level/LobbyLevel   액터 74개  - 로그인한 사용자가 스폰되는 레벨
;   GameLevelName 은 **에셋 이름**만 적습니다. 전체 경로를 적어도 동작하도록
;   코드에서 마지막 '/' 뒤만 잘라 비교합니다.
LoginWidgetClass=/Game/AMC1/Blueprints/UI/WBP_Login.WBP_Login_C
GameLevelName=LobbyLevel
