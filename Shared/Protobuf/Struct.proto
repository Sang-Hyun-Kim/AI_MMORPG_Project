syntax = "proto3";
package Protocol;

message PositionInfo {
    float x = 1;
    float y = 2;
    float z = 3;
    float yaw = 4;
}

message ObjectInfo {
    uint64 objectId = 1;
    string name = 2;
    PositionInfo posInfo = 3;
}

message PlayerInfo {
    ObjectInfo objectInfo = 1;
    int32 level = 2;
}
